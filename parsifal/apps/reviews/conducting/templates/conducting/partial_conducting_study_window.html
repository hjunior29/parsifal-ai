{% comment %}
  The window that shows a study on Quality Assessment and Data Extraction (the "Study" link of each study's panel);
  its content comes from study_window.
{% endcomment %}
<div class="modal fade" id="modal-study" tabindex="-1" role="dialog" aria-labelledby="modal-study-title">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title" id="modal-study-title">Study</h4>
      </div>
      <div class="modal-body" style="overflow-y: auto;"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
