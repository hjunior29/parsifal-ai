{% comment %}The star of a study (the study list's column and the title of the study window); toggled by star_article.{% endcomment %}
<a href="#" class="js-star{% if article.starred %} starred{% endif %}" data-article-id="{{ article.id }}" role="button" aria-pressed="{{ article.starred|yesno:'true,false' }}" title="{% if article.starred %}Starred{% if article.starred_by %} by {{ article.starred_by.profile.get_screen_name }}{% endif %} on {{ article.starred_at|date:'j M Y' }}. Click to unstar{% else %}Star this study in the review{% endif %}"><span class="hide">{{ article.starred|yesno:'0,1' }}</span><span class="glyphicon glyphicon-star{% if not article.starred %}-empty{% endif %}"></span></a>
