<div class="articles clearfix">
  <div class="source-buttons">
    {% if not source.id %}
      <div style="margin-bottom: 20px">
        <button type="button" class="btn btn-sm btn-default btn-find-duplicates">
          <span class="glyphicon glyphicon-duplicate"></span>
          Find Duplicates
        </button>
        <form method="post" action="{% url 'reviews:conducting:export_results' %}" style="display: inline-block;">
          {% csrf_token %}
          <input type="hidden" name="review-id" value="{{ review.id }}">
          <button type="submit" class="btn btn-sm btn-default">
            <span class="glyphicon glyphicon-download-alt"></span>
            Export Articles
          </button>
        </form>
        <button type="button" class="btn btn-sm btn-default btn-ai-screening" data-phase="exclusion" title="Jev rejects the studies that clearly meet an exclusion criterion">
          <span class="glyphicon glyphicon-flash"></span>
          Exclude with AI
        </button>
        <button type="button" class="btn btn-sm btn-default btn-ai-screening" data-phase="inclusion" title="Jev accepts the studies that meet the inclusion criteria (all, or one, as the protocol says)">
          <span class="glyphicon glyphicon-ok-circle"></span>
          Include with AI
        </button>
        <button type="button" class="btn btn-sm btn-default btn-ai-screening" data-phase="screen" title="Both in one request: Jev rejects by the exclusion criteria, else accepts by the inclusion criteria, else leaves the study undecided">
          <span class="glyphicon glyphicon-filter"></span>
          Screen with AI
        </button>
      </div>
    {% endif %}
    <div class="studies-action clearfix" style="margin: 10px 0;">
      <div class="pull-right studies-search">
        <div class="input-group">
          <span class="input-group-btn">
            <button type="button" class="btn btn-default js-starred-filter" aria-pressed="false" title="Show only the starred studies (with the status chosen in Show and the search); the number counts every starred study of this tab">
              <span class="glyphicon glyphicon-star"></span> <span class="starred-count">{{ starred_count }}</span>
            </button>
          </span>
          <input type="search" class="form-control js-article-search" placeholder="Search title, DOI or BibTeX key" aria-label="Search title, DOI or BibTeX key" autocomplete="off">
          <span class="input-group-btn">
            <button type="button" class="btn btn-default" data-toggle="modal" data-target="#modal-columns" title="Choose the columns of this list and their order">
              <span class="glyphicon glyphicon-th-list"></span> Columns
            </button>
          </span>
        </div>
      </div>
      <strong>Action:</strong>
      <select class="select-action form-control" style="width: 200px; display: inline-block;">
        <option value="">Select...</option>
        <option value="remove">Remove selected</option>
        <option value="unclassify">Mark as unclassified</option>
        <option value="accept">Mark as accepted</option>
        <option value="reject">Mark as rejected</option>
        <option value="duplicated">Mark as duplicated</option>
      </select>
      <button type="button" class="btn btn-default go-button">Go</button>
      <span class="text-muted"><span class="articles-selected">0</span> of <span class="articles-total">{{ page.object_list|length }}</span> selected on this page</span>
    </div>
    <p>
      <strong>Show:</strong>
      <label class="radio-inline">
        <input type="radio" name="filter" value="ALL" checked> All
      </label>
      <label class="radio-inline">
        <input type="radio" name="filter" value="A"> Accepted
      </label>
      <label class="radio-inline">
        <input type="radio" name="filter" value="R"> Rejected
      </label>
      <label class="radio-inline">
        <input type="radio" name="filter" value="U"> Unclassified
      </label>
      <label class="radio-inline">
        <input type="radio" name="filter" value="D"> Duplicated
      </label>
    </p>
  </div>
  <div class="source-articles">
    {% include "conducting/partial_conducting_articles_list.html" %}
  </div>
</div>
