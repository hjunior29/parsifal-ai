{% load i18n %}

<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <div class="footer-brand-group">
        <a href="{% url 'home' %}" class="footer-brand">Parsifal</a>
        <span class="footer-meta">
          {% trans "by" %} <a href="https://github.com/hjunior29" target="_blank" rel="noopener noreferrer">Helder Junior</a>
          <span class="footer-sep" aria-hidden="true">&middot;</span>
          <span class="text-muted">{% trans "based on" %} <a href="https://github.com/vitorfs/parsifal" target="_blank" rel="noopener noreferrer">upstream</a></span>
        </span>
      </div>

      <nav class="footer-nav" aria-label="{% trans 'Footer navigation' %}">
        <a href="{% url 'about' %}">{% trans "About" %}</a>
        <a href="{% url 'docs:index' %}">{% trans "Docs" %}</a>
        <a href="/api/v1/docs">{% trans "API" %}</a>
        <span class="footer-version" title="Parsifal version">v{{ parsifal_version }}</span>
        <a href="https://github.com/hjunior29/parsifal-ai" class="footer-github" target="_blank" rel="noopener noreferrer" data-toggle="tooltip" title="Source code (parsifal-ai)" data-placement="top" aria-label="GitHub repository">
          <span class="fa fa-github" aria-hidden="true"></span>
        </a>
      </nav>
    </div>
  </div>
</footer>
