name: Docker

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build image
      run: docker build -t parsifal-ai:ci .
    - name: Bootstrap an instance
      run: |
        mkdir -p data
        docker run --rm -v "$PWD/data:/data" -e SECRET_KEY=ci parsifal-ai:ci \
          init --username admin --email ci@example.org --password 'Ci-Passw0rd!' --token ci | tee init.out
        grep -o 'pfl_[A-Za-z0-9_-]*' init.out | head -1 > token.txt
    - name: Serve and call the API
      run: |
        CID=$(docker run -d --rm -v "$PWD/data:/data" -e SECRET_KEY=ci -p 8000:8000 parsifal-ai:ci serve)
        for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/login/ && break; sleep 2; done
        curl -sf -o /dev/null http://localhost:8000/static/css/parsifal.css
        curl -sf -H "Authorization: Bearer $(cat token.txt)" http://localhost:8000/api/v1/me | grep '"username":"admin"'
        docker logs "$CID" | tail -20
        docker stop "$CID"
