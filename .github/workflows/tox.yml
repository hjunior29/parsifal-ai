name: Tox

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
    - name: Set up Tox
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Run Tox
      run: tox
