[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parsifal-cli"
version = "0.1.0"
description = "Command-line client and MCP server for a Parsifal instance (systematic literature reviews)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]
dev = ["pytest>=8"]

[project.scripts]
parsifal = "parsifal_cli.cli:main"
parsifal-mcp = "parsifal_mcp.server:main"

[tool.setuptools.packages.find]
include = ["parsifal_cli*", "parsifal_mcp*"]

[tool.setuptools.package-data]
parsifal_cli = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
